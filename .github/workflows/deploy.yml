name: Deploy

on:
  push:
    branches:
      - develop
      - 'release/**'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-real
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: '15'
      QUEUE_CONNECTION_STRING: UseDevelopmentStorage=true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements/local.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy .

      - name: Apply DB migrations
        run: alembic upgrade head

      - name: Run tests
        run: |
          # test_azure_sms_queue.py needs a real Azure Storage Queue (Azurite
          # locally). It already runs as part of `docker compose exec app
          # pytest` in local dev; excluded here for now.
          pytest --ignore=tests/unit/infrastructure/messaging

      - name: Package app
        run: zip -r app.zip . -x '.git/*' 'app.zip'

      - uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.zip

  deploy-dev:
    needs: build-and-test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-package

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: app-azure-app-login-dev
          package: app.zip

  deploy-stage:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-package

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: app-azure-app-login-stage
          package: app.zip
