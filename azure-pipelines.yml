trigger:
  branches:
    include:
      - develop
      - release/*

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.12'

resources:
  containers:
    - container: postgres
      image: postgres:16-alpine
      ports:
        - 5432:5432
      env:
        POSTGRES_USER: ci_user
        POSTGRES_PASSWORD: ci_password
        POSTGRES_DB: ci_db

stages:
  - stage: Build
    jobs:
      - job: Test
        services:
          postgres: postgres
        variables:
          DATABASE_URL: 'postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db'
          JWT_SECRET_KEY: 'ci-only-secret-not-used-anywhere-real'
          JWT_ALGORITHM: 'HS256'
          ACCESS_TOKEN_EXPIRE_MINUTES: '15'
          # Dummy value: Settings() requires it to be set, but no test in this
          # job talks to a real queue (see --ignore below).
          QUEUE_CONNECTION_STRING: 'UseDevelopmentStorage=true'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)

          - script: pip install -r requirements/local.txt
            displayName: 'Install dependencies'

          - script: ruff check .
            displayName: 'Lint (ruff check)'

          - script: ruff format --check .
            displayName: 'Format check (ruff format)'

          - script: mypy .
            displayName: 'Type check (mypy)'

          - script: alembic upgrade head
            displayName: 'Apply DB migrations'

          - script: |
              # test_azure_sms_queue.py is excluded here: it needs a real
              # Azure Storage Queue (Azurite locally). It already runs as
              # part of `docker compose exec app pytest` in local dev.
              pytest --ignore=tests/unit/infrastructure/messaging
            displayName: 'Run tests'

          - task: ArchiveFiles@2
            displayName: 'Archive app'
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
              includeRootFolder: false
              archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/app.zip'
              artifactName: drop

  - stage: DeployDev
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: DeployWebAppDev
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: 'sc-azure-app-login-dev'
                    appType: webAppLinux
                    appName: 'app-azure-app-login-dev'
                    package: '$(Pipeline.Workspace)/drop/app.zip'

  - stage: DeployStage
    dependsOn: Build
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))
    jobs:
      - deployment: DeployWebAppStage
        environment: stage
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: 'sc-azure-app-login-stage'
                    appType: webAppLinux
                    appName: 'app-azure-app-login-stage'
                    package: '$(Pipeline.Workspace)/drop/app.zip'
